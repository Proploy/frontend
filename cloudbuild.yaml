# TODO(deploy): tag images with ${SHORT_SHA}, not :latest.
#
# service-apis and agent-harness both push `<image>:${SHORT_SHA}`; this
# pipeline pushes `:latest` for both the cache and the final image. Rollback
# is NOT at risk — Cloud Run resolves the tag to an immutable digest at deploy
# time, so every revision stays pinned to the bits it shipped with. What you
# lose is traceability: nothing on the Cloud Run revision says which commit is
# running, so you have to correlate the revision's timestamp against Cloud
# Build history to find the SHORT_SHA.
#
# Known deployments (recorded by hand because the tag does not carry them):
#   proploy-frontend-00018-7xt  commit c5cfc69  build 2026-09-12 12:33
#   proploy-frontend-00017-wm2  commit 56f0ed4  build 2026-09-04 19:23
#
# The fix: replace the four `:latest` occurrences on the final image with
# `:${SHORT_SHA}` (keep `:builder` as-is — it is a cache tag and is meant to
# be mutable), and update the `images:` block and the `--image` deploy arg to
# match. While here, also drop DATABASE_URL from this pipeline: nothing in the
# app reads it at build or runtime, and `ENV DATABASE_URL` in the builder
# stage bakes the credential into the `:builder` image pushed to Artifact
# Registry. See docs/deployment/production-readiness-review-2026-09-12.md.

steps:
  # 1. Pull the previous cache images to use as a Docker cache (speeds up npm ci)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull australia-southeast1-docker.pkg.dev/$PROJECT_ID/proploy-frontend/proploy-frontend:builder || exit 0']
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull australia-southeast1-docker.pkg.dev/$PROJECT_ID/proploy-frontend/proploy-frontend:latest || exit 0']

  # 2. Build and cache the builder stage (node_modules + .next/cache)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    secretEnv: ['NEXT_PUBLIC_SUPABASE_URL', 'NEXT_PUBLIC_SUPABASE_ANON_KEY', 'NEXT_PUBLIC_APP_URL', 'NEXT_PUBLIC_SERVICE_APIS_URL', 'DATABASE_URL']
    args:
    - '-c'
    - |
      DOCKER_BUILDKIT=1 docker build \
        --target builder \
        --cache-from australia-southeast1-docker.pkg.dev/$PROJECT_ID/proploy-frontend/proploy-frontend:builder \
        -t australia-southeast1-docker.pkg.dev/$PROJECT_ID/proploy-frontend/proploy-frontend:builder \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --build-arg NEXT_PUBLIC_SUPABASE_URL="$$NEXT_PUBLIC_SUPABASE_URL" \
        --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
        --build-arg NEXT_PUBLIC_APP_URL="$$NEXT_PUBLIC_APP_URL" \
        --build-arg NEXT_PUBLIC_SERVICE_APIS_URL="$$NEXT_PUBLIC_SERVICE_APIS_URL" \
        --build-arg DATABASE_URL="$$DATABASE_URL" \
        .

  # 3. Build the final image using both caches
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    secretEnv: ['NEXT_PUBLIC_SUPABASE_URL', 'NEXT_PUBLIC_SUPABASE_ANON_KEY', 'NEXT_PUBLIC_APP_URL', 'NEXT_PUBLIC_SERVICE_APIS_URL', 'DATABASE_URL']
    args:
    - '-c'
    - |
      DOCKER_BUILDKIT=1 docker build \
        --cache-from australia-southeast1-docker.pkg.dev/$PROJECT_ID/proploy-frontend/proploy-frontend:builder \
        --cache-from australia-southeast1-docker.pkg.dev/$PROJECT_ID/proploy-frontend/proploy-frontend:latest \
        -t australia-southeast1-docker.pkg.dev/$PROJECT_ID/proploy-frontend/proploy-frontend:latest \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --build-arg NEXT_PUBLIC_SUPABASE_URL="$$NEXT_PUBLIC_SUPABASE_URL" \
        --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
        --build-arg NEXT_PUBLIC_APP_URL="$$NEXT_PUBLIC_APP_URL" \
        --build-arg NEXT_PUBLIC_SERVICE_APIS_URL="$$NEXT_PUBLIC_SERVICE_APIS_URL" \
        --build-arg DATABASE_URL="$$DATABASE_URL" \
        .

  # 4. Push the new images (cache & final)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'australia-southeast1-docker.pkg.dev/$PROJECT_ID/proploy-frontend/proploy-frontend:builder']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'australia-southeast1-docker.pkg.dev/$PROJECT_ID/proploy-frontend/proploy-frontend:latest']

  # 4. Deploy to Cloud Run, injecting secrets directly at runtime
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
    - 'run'
    - 'deploy'
    - 'proploy-frontend'
    - '--image'
    - 'australia-southeast1-docker.pkg.dev/$PROJECT_ID/proploy-frontend/proploy-frontend:latest'
    - '--region'
    - 'australia-southeast1'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'
    - '--service-account'
    - 'proploy-deployer@coral-polymer-484212-r3.iam.gserviceaccount.com'
    - '--remove-env-vars'
    - 'NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_SERVICE_APIS_URL,DATABASE_URL'
    - '--set-secrets'
    - >-
      NEXT_PUBLIC_SUPABASE_URL=NEXT_PUBLIC_SUPABASE_URL:latest,
      NEXT_PUBLIC_SUPABASE_ANON_KEY=NEXT_PUBLIC_SUPABASE_ANON_KEY:latest,
      NEXT_PUBLIC_APP_URL=FRONTEND_ORIGIN:latest,
      NEXT_PUBLIC_SERVICE_APIS_URL=CATALOG_SERVICE_URL:latest,
      DATABASE_URL=DATABASE_URL:latest

images:
  - 'australia-southeast1-docker.pkg.dev/$PROJECT_ID/proploy-frontend/proploy-frontend:latest'

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SUPABASE_URL/versions/latest
    env: 'NEXT_PUBLIC_SUPABASE_URL'
  - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SUPABASE_ANON_KEY/versions/latest
    env: 'NEXT_PUBLIC_SUPABASE_ANON_KEY'
  - versionName: projects/$PROJECT_ID/secrets/FRONTEND_ORIGIN/versions/latest
    env: 'NEXT_PUBLIC_APP_URL'
  - versionName: projects/$PROJECT_ID/secrets/CATALOG_SERVICE_URL/versions/latest
    env: 'NEXT_PUBLIC_SERVICE_APIS_URL'
  - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
    env: 'DATABASE_URL'

options:
  logging: CLOUD_LOGGING_ONLY
