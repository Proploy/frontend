apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: proploy-frontend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 80
      containers:
      - image: asia-south1-docker.pkg.dev/coral-polymer-484212-r3/proploy-frontend/proploy-frontend
        ports:
        - containerPort: 3000
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
        env:
        - name: NODE_ENV
          value: "production"
        # Add other environment variables here or via CLI
