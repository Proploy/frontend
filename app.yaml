# Google App Engine configuration
runtime: nodejs20
env: standard
service: default

instance_class: F2

env_variables:
  NODE_ENV: production

automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.6
# Note: Set sensitive environment variables in Google Cloud Console
# under App Engine > Settings > Environment Variables
# or use Secret Manager for production

